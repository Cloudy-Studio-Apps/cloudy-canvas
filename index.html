<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudy Canvas</title>
    <script>
      // Show the theme of the last run before first paint (no white flash in a dark theme). The key
      // matches THEME_CSS_KEY in shared/stores/theme-store.ts; app/theme/apply-theme.ts writes it.
      try {
        var cached = JSON.parse(localStorage.getItem("cloudy-canvas:theme-css") || "null");
        if (cached && typeof cached.css === "string") {
          var style = document.createElement("style");
          style.id = "cloudy-theme";
          style.textContent = cached.css;
          document.head.appendChild(style);
          document.documentElement.classList.toggle("dark", !!cached.dark);
          document.documentElement.dataset.appearance = cached.dark ? "dark" : "light";
        }
      } catch (_) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
